name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # mmsim and the tests only need numpy; pandas, matplotlib and jupyter are for the notebook
        run: python -m pip install "numpy>=1.24" "pytest>=7.0"
      - name: Run tests
        run: python -m pytest -q
